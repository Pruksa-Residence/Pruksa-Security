<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Pruksa Security Scanner V6</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font:16px system-ui,sans-serif;background:#f6f1e7;color:#463b2e;margin:0}main{max-width:520px;margin:auto;padding:20px}section{background:white;border-radius:18px;padding:20px}h1{color:#667d55;font-size:23px;text-align:center}label{display:block;margin:14px 0 6px}input,button,select,a.action{box-sizing:border-box;width:100%;padding:13px;font:inherit;border-radius:10px;margin:5px 0}input,select{border:1px solid #ccc}button,a.action{background:#667d55;color:white;border:0;font-weight:bold;cursor:pointer;text-align:center}a.action{display:block;text-decoration:none}button:disabled{opacity:.5}#msg{white-space:pre-wrap;overflow-wrap:anywhere}#reader{width:100%}[hidden]{display:none!important}</style></head><body><main><section><h1>PRUKSA RESIDENCE KKU</h1><p style="text-align:center">SECURITY SCANNER · V6</p><label for="url">URL เว็บแอป Apps Script (ตั้งค่าครั้งแรก)</label><input id="url" type="url" placeholder="https://script.google.com/macros/s/.../exec"><button id="save">บันทึก URL</button><label for="camera">เลือกกล้อง</label><select id="camera"><option value="">อัตโนมัติ</option></select><button id="start">เปิดกล้องสแกน QR</button><div id="reader"></div><button id="stop" disabled>หยุดกล้อง</button><label for="file">อ่าน QR จากภาพ</label><input id="file" type="file" accept="image/*" capture="environment"><label for="code">รหัสบัตรผ่าน 6 หลัก (สำรอง)</label><input id="code" inputmode="numeric" maxlength="6"><button id="manual">ตรวจสอบรหัส</button><p id="msg" role="status"></p><a id="open" class="action" target="_blank" rel="noopener noreferrer" hidden>เปิดหน้าตรวจสอบ / CHECK-IN / CHECK-OUT</a><button id="next">สแกนบัตรถัดไป</button><p>ข้อมูลผู้มาติดต่อและ PIN จะกรอกเฉพาะในเว็บแอป Google เดิม ไม่เก็บบนเว็บไซต์นี้</p></section></main><script>
const $=id=>document.getElementById(id);let scanner=null,busy=false,found=false;
const msg=s=>$('msg').textContent=s;
function base(){const u=$('url').value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(u))throw Error('กรุณากรอก URL เว็บแอป /exec ให้ถูกต้อง');return u;}
try{$('url').value=localStorage.getItem('pruksaAppUrl')||'';}catch(e){}
$('save').onclick=()=>{try{const u=base();localStorage.setItem('pruksaAppUrl',u);msg('บันทึก URL แล้ว');}catch(e){msg(e.message);}};
function result(raw){let token=String(raw).trim();if(token.startsWith('https://')){const u=new URL(token);token=u.searchParams.get('token')||'';}if(!/^(?:[a-f0-9]{64}|[0-9]{6})$/i.test(token))throw Error('ไม่ใช่ QR บัตรผ่านของระบบ');$('open').href=base()+'?page=guard&token='+encodeURIComponent(token);$('open').hidden=false;found=true;msg('อ่านรหัสสำเร็จ กดเปิดหน้าตรวจสอบ แล้วกรอกชื่อและ PIN');}
async function stop(){if(scanner){try{await scanner.stop();}catch(e){}try{scanner.clear();}catch(e){}scanner=null;}$('stop').disabled=true;$('start').disabled=false;}
async function start(){if(busy)return;busy=true;$('start').disabled=true;found=false;$('open').hidden=true;try{base();if(!window.isSecureContext||!navigator.mediaDevices)throw Error('ต้องเปิดเว็บไซต์ HTTPS ใน Safari หรือ Chrome โดยตรง');if(!window.Html5Qrcode)throw Error('โหลดไลบรารีไม่สำเร็จ');await stop();$('start').disabled=true;let selected=$('camera').value;let cams=[];try{cams=await Html5Qrcode.getCameras();}catch(e){}$('camera').replaceChildren(new Option('อัตโนมัติ',''));cams.forEach((c,i)=>$('camera').add(new Option(c.label||'กล้อง '+(i+1),c.id)));if(cams.some(c=>c.id===selected))$('camera').value=selected;let errors=[];for(const choice of [ ...(selected?[selected]:[]),{facingMode:'environment'},...cams.map(c=>c.id),{facingMode:'user'}]){scanner=new Html5Qrcode('reader');try{await scanner.start(choice,{fps:10,qrbox:(w,h)=>{let n=Math.floor(Math.min(w,h)*.75);return {width:n,height:n};}},raw=>{if(found)return;try{result(raw);scanner.pause(true);}catch(e){msg(e.message);}});$('stop').disabled=false;msg('ส่อง QR Code ให้ชัดเจน');return;}catch(e){errors.push(String(e));await stop();}}throw Error(errors.join(' / '));}catch(e){await stop();msg('เปิดกล้องไม่ได้: '+e.message);}finally{busy=false;}}
$('start').onclick=start;$('stop').onclick=()=>{if(!busy)stop();};$('next').onclick=async()=>{if(busy)return;await stop();$('code').value='';await start();};$('manual').onclick=async()=>{if(busy)return;await stop();$('open').hidden=true;try{if(!/^\d{6}$/.test($('code').value))throw Error('กรอกรหัส 6 หลัก');result($('code').value);}catch(e){msg(e.message);}};$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||busy)return;busy=true;try{await stop();$('open').hidden=true;scanner=new Html5Qrcode('reader');result(await scanner.scanFile(f,false));}catch(e){msg('อ่านภาพไม่ได้: '+e);}finally{await stop();busy=false;}};
</script></body></html>
